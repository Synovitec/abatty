# A release is a tag: `vX.Y.Z` pushed after the version and the changelog section are on
# main. The gate runs again on the tagged commit, then the package is published to the
# registry with provenance (the tarball attested to this workflow and this commit). The token
# is a granular automation token stored as NPM_TOKEN; without it the publish step fails and
# nothing is released.
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
  # The workload identity the registry's provenance and the conformance signature are both made
  # with: short-lived, issued to this run, and not exportable by anybody.
  id-token: write
  attestations: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run -s gate
      - name: the tag is the version
        run: |
          v="$(node -p "require('./package.json').version")"
          [ "refs/tags/v$v" = "$GITHUB_REF" ] || { echo "tag $GITHUB_REF is not v$v"; exit 1; }
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      # What held at the released commit, signed by the run rather than by a key anybody holds.
      # The package prints the statement and never signs: a signature is worth the identity
      # behind it, and a measurement tool's only identity would be a key on a laptop or a secret
      # in a repository, which is the weakest of the options and the likeliest to leak.
      - name: the conformance statement for this release
        run: node bin/abatty.mjs attest --out abatty-conformance.json || true
      - name: sign it with this run's identity
        uses: actions/attest@v2
        with:
          subject-path: abatty-conformance.json
          predicate-type: https://abatty.dev/attestation/conformance/v1
          predicate-path: abatty-conformance.json
