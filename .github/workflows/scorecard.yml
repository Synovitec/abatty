# The supply-chain checks an adopter reads before installing a package that runs in their hooks:
# pinned actions, token permissions, branch protection, signed releases. A zero-dependency package
# concentrates its whole risk in its own repository and publish path, so it is measured by the
# same card everyone else is, weekly and on every push to main, with the results published.
name: scorecard
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"
permissions: read-all
jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3.38.2
        with:
          sarif_file: results.sarif
          category: scorecard
