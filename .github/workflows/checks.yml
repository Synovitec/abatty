# The package's own gate on every push and pull request: the same command a contributor runs
# (format, typecheck, tests, the ratchet, the secret scan, the scrub). Adopters' pipelines are
# generated by `abatty ci`; this one is the package's, written by hand because its gate is
# the npm script, not a preset's.
name: checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  # Every Node the package claims (`engines`), not only the newest: a launcher spawned the way
  # only one version accepts is exactly what one runner cannot see. The claim is the package's:
  # no runtime dependency, so its own suite and typecheck are what Node 20 must pass. The whole
  # gate runs on 22, because the repository's graph tooling (dependency-cruiser) refuses 20 and
  # said so on this matrix's first run; that is the tooling's floor, not the package's.
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The findings are uploaded to code scanning, which is what puts them on the diff of the
      # change under review rather than in a report nobody opens. This job alone uploads.
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: the whole gate, where the repository's tooling runs
        if: matrix.node == '22'
        run: npm run -s gate
      - name: the package on the oldest Node it claims
        if: matrix.node != '22'
        run: npm run -s typecheck && npm test
      - name: the tarball a third party installs
        run: npm pack --dry-run
      # Emitted and uploaded even when a step above went red: a run that failed is exactly the run
      # whose findings a reviewer needs on the diff. Uploaded once per commit, from the newest Node.
      - name: findings as SARIF
        if: always() && matrix.node == '22'
        # 3 means findings, which is what the file is for; anything else is a crash, and a step
        # that swallowed it would upload nothing and say nothing.
        run: |
          node bin/abatty.mjs ratchet --range auto --sarif > abatty.sarif || code=$?
          [ "${code:-0}" -eq 0 ] || [ "${code:-0}" -eq 3 ]
          test -s abatty.sarif
      - name: upload the findings
        if: always() && matrix.node == '22'
        uses: github/codeql-action/upload-sarif@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3.38.2
        with:
          sarif_file: abatty.sarif
          category: abatty

  # The gate above runs at UTC, which is the one clock on which a date bug derived from UTC is
  # invisible: a day sliced off a UTC instant is correct there and wrong everywhere else. The
  # regression cases pin their own zone internally, so they catch it wherever they run; this job
  # is the second net, and it is what makes the whole SUITE - including every case written from
  # now on by somebody who has not read VALID.5 - run once on a clock whose calendar day is not
  # UTC's. A named city would not do: it agrees with UTC for most of the day, so the job would
  # read green against the very defect it exists for.
  skewed-clock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: a zone whose calendar day is never today's UTC one
        run: |
          # Etc/GMT+12 is UTC-12 and Etc/GMT-12 is UTC+12: the sign is inverted, by POSIX. Before
          # noon UTC the western one is on yesterday; from noon the eastern one is on tomorrow.
          if [ "$(date -u +%H)" -lt 12 ]; then tz=Etc/GMT+12; else tz=Etc/GMT-12; fi
          echo "TZ=$tz" >> "$GITHUB_ENV"
          echo "suite clock $tz · local day $(TZ=$tz date +%F) · UTC day $(date -u +%F)"
      - run: npm test

  # The same gate on the other operating system the package claims. For two days the gate could
  # not start on Windows (a tool launcher spawned without the shell a batch file needs) and main
  # went red three ways that no run could see, because every run was on Linux: a false green one
  # level up from the ones the gate refuses. This job is what keeps that from coming back; the
  # eight cases that were pinned to a POSIX machine are the ones it would have caught first.
  # Once per package manager the package spawns: the launcher fix is proved on the real
  # `pnpm.cmd` as well as on `npm.cmd` (the suite spawns every launcher it finds on PATH), because
  # the trial's repository is pnpm on Windows and nothing here had ever run pnpm there.
  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        pm: [npm, pnpm]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        if: matrix.pm == 'pnpm'
        with:
          version: 10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run -s gate

  # The audit on a real install, per package manager and per operating system, in both directions:
  # a clean install audits clean and a known high advisory fails. The suite reads each manager's
  # report from a recording; this job checks the recording against the tool as it ships today.
  # yarn 1 comes with the runner images; pnpm is set up here.
  managers:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        pm: [npm, pnpm, yarn]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        if: matrix.pm == 'pnpm'
        with:
          version: 10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: the audit of ${{ matrix.pm }}, clean and with a known advisory
        run: node scripts/ci/manager-smoke.mjs ${{ matrix.pm }}
