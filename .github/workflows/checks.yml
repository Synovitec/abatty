# The package's own gate on every push and pull request: the same command a contributor runs
# (format, typecheck, tests, the ratchet, the secret scan, the scrub). Adopters' pipelines are
# generated by `abatty ci`; this one is the package's, written by hand because its gate is
# the npm script, not a preset's.
name: checks
on:
  push:
  pull_request:
permissions:
  contents: read
  # The findings are uploaded to code scanning, which is what puts them on the diff of the change
  # under review rather than in a report nobody opens.
  security-events: write
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run -s gate
      - name: the tarball a third party installs
        run: npm pack --dry-run
      # Emitted and uploaded even when a step above went red: a run that failed is exactly the run
      # whose findings a reviewer needs on the diff.
      - name: findings as SARIF
        if: always()
        run: npx abatty ratchet --range auto --sarif > abatty.sarif || true
      - name: upload the findings
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: abatty.sarif
          category: abatty
